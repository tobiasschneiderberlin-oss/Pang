name: eval-intake-live

# Live A22 eval — real Anthropic calls, real cost. Runs on explicit
# dispatch only (plus a weekly schedule so we catch model-side drift
# without babysitting it). Mock-mode runs on every PR in ci.yml.
#
# To trigger manually: Actions → eval-intake-live → Run workflow.
on:
  workflow_dispatch:
  schedule:
    # Sunday 04:00 UTC — cheap off-hours.
    - cron: "0 4 * * 0"

# Least-privilege — the eval job only needs to read the checkout;
# the ANTHROPIC_API_KEY comes from secrets, not GITHUB_TOKEN scope.
permissions:
  contents: read

jobs:
  eval:
    name: A22 intake eval (live)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SUPABASE_HOST: "example.supabase.co"
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    defaults:
      run:
        working-directory: pang-2026
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: pang-2026/.nvmrc
          cache: npm
          cache-dependency-path: pang-2026/package-lock.json
      # See ci.yml for the install rationale (cross-platform lockfile
      # vs. Linux x64 optional binaries).
      - name: Install
        run: |
          npm ci --no-audit --no-fund --prefer-offline
          npm install --no-save --no-audit --no-fund \
            lightningcss-linux-x64-gnu \
            @tailwindcss/oxide-linux-x64-gnu
      - name: Run live eval
        run: npm run eval:intake
