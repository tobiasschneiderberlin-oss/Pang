name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: PANG gates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Strict mode: skip → fail. Every gate must land pass or fail.
      PANG_STRICT: "1"
      # Supabase host used by next.config CSP construction. CI does
      # not hit Supabase; the placeholder keeps the config typeable.
      NEXT_PUBLIC_SUPABASE_HOST: "example.supabase.co"
    defaults:
      run:
        working-directory: pang-2026
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: pang-2026/.nvmrc
          cache: npm
          cache-dependency-path: pang-2026/package-lock.json

      # `npm install` (not `npm ci`) matches Vercel's installCommand
      # and tolerates a lockfile generated on a different platform —
      # necessary because the lockfile is authored on macOS arm64 and
      # npm ci on Linux x64 misses the Linux optional binaries for
      # lightningcss / @tailwindcss/oxide. Trades strict lockfile
      # enforcement for cross-platform reliability; CI's verify chain
      # (typecheck + gates + eval) plus the e2e job already guards
      # against version drift.
      - name: Install
        run: npm install --no-audit --no-fund --prefer-offline

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Manifest check (P1)
        run: npm run check:manifest

      - name: String audit (voice doctrine)
        run: npm run check:strings

      - name: Gate runner (P1\u2013P10, P23\u2013P25 + A1\u2013A4, A7, A8, A16, A21)
        run: npm run check:gates

      - name: Debug — native binary presence (remove after green)
        run: |
          echo "::group::node_modules native bindings"
          ls node_modules/lightningcss/node/ 2>&1 | head -20 || true
          echo "---"
          ls node_modules/lightningcss-*/ 2>&1 | head -20 || true
          echo "---"
          ls node_modules/@next/swc-*/ 2>&1 | head -20 || true
          echo "---"
          ls node_modules/@tailwindcss/oxide-*/ 2>&1 | head -20 || true
          echo "---"
          npm ls lightningcss --all 2>&1 | head -30 || true
          echo "::endgroup::"

      - name: Build
        run: npm run build 2>&1 | tee /tmp/build.log
        continue-on-error: true

      - name: Upload build log (remove after green)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: /tmp/build.log
          retention-days: 3
          if-no-files-found: warn

      - name: Fail if build failed (remove after green)
        run: |
          grep -qE 'Build error|Error:' /tmp/build.log && exit 1 || true
          test -d .next || { echo "no .next — build did not produce output"; exit 1; }

      - name: A22 eval (mock — harness sanity)
        run: npm run check:eval

      # Share the built app with the downstream `e2e` job instead of
      # rebuilding. `.next/` + generated `public/sw.js` are all
      # `next start` needs. Saves ~2 min per PR.
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: next-build
          path: |
            pang-2026/.next/
            pang-2026/public/sw.js
          retention-days: 1
          if-no-files-found: error

  e2e:
    name: Playwright e2e (Tier 2)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: gates
    env:
      NEXT_PUBLIC_SUPABASE_HOST: "example.supabase.co"
      # Serve the prod build (downloaded from gates) via `next start`
      # for parity with Vercel. Playwright's webServer respects CI=1
      # and runs `npm run start`.
      CI: "1"
    defaults:
      run:
        working-directory: pang-2026
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: pang-2026/.nvmrc
          cache: npm
          cache-dependency-path: pang-2026/package-lock.json

      # `npm install` for the same cross-platform reason as `gates`.
      - name: Install
        run: npm install --no-audit --no-fund --prefer-offline

      # Reuse the `.next/` and `public/sw.js` that `gates` built.
      # download-artifact unpacks preserving archived paths, so files
      # land back at `pang-2026/.next/` and `pang-2026/public/sw.js`.
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: next-build

      # Cache Playwright browsers across runs. The key is tied to
      # `package-lock.json` (Playwright version moves with the lock).
      # Cache hit → skip browser download, only install apt deps.
      # Cache miss → full `install --with-deps`.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pang-2026/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright browsers (cache miss)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system deps (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Run Playwright (headless)
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: pang-2026/playwright-report/
          retention-days: 7
