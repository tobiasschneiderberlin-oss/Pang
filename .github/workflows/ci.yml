# PANG — CI.
#
# Audit Day 3: typecheck + tests + build on every PR. Three jobs run
# in parallel, all on Node 22 with pnpm via corepack. The previous
# workflow targeted pang-2026/ and an npm/lockfile setup; that's gone.
# This one runs against pang/ with pnpm.
#
# Adding a job? Pin its actions to a major version (@v6, not @latest)
# and keep the working-directory rooted at pang/. Anything that needs
# secrets goes in a separate workflow with `workflow_dispatch` so
# accidental fork PRs don't burn cost.

name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege default — jobs read the checkout, nothing more.
permissions:
  contents: read

defaults:
  run:
    working-directory: pang

jobs:
  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: pang/.nvmrc
      - name: Enable corepack (pnpm)
        run: corepack enable
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm run typecheck

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: pang/.nvmrc
      - name: Enable corepack (pnpm)
        run: corepack enable
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Vitest
        run: pnpm run test

  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # CI does not hit Supabase / Anthropic / R2; these placeholders
      # let the env validator pass at module load. NODE_ENV is left
      # at the default Vercel sets at build time.
      NEXT_PUBLIC_APP_URL: "http://localhost:3000"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: pang/.nvmrc
      - name: Enable corepack (pnpm)
        run: corepack enable
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm run build
