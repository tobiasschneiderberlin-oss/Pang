name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: PANG gates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Strict mode: skip → fail. Every gate must land pass or fail.
      PANG_STRICT: "1"
      # Supabase host used by next.config CSP construction. CI does
      # not hit Supabase; the placeholder keeps the config typeable.
      NEXT_PUBLIC_SUPABASE_HOST: "example.supabase.co"
    defaults:
      run:
        working-directory: pang-2026
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: pang-2026/.nvmrc
          cache: npm
          cache-dependency-path: pang-2026/package-lock.json

      # Cross-platform lockfile: the lockfile is authored on macOS
      # arm64, which means npm on Linux x64 doesn't get the Linux
      # optional binaries for lightningcss + @tailwindcss/oxide that
      # Next.js 16 + Tailwind v4 need at build time. Install the main
      # tree with `npm ci` (fast + strict), then top up the platform
      # binaries explicitly. Same pattern Vercel uses internally.
      - name: Install
        run: |
          npm ci --no-audit --no-fund --prefer-offline
          # Force-install Linux x64 native binaries that the macOS
          # lockfile doesn't list. --no-save keeps package.json clean.
          npm install --no-save --no-audit --no-fund \
            lightningcss-linux-x64-gnu \
            @tailwindcss/oxide-linux-x64-gnu

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Manifest check (P1)
        run: npm run check:manifest

      - name: String audit (voice doctrine)
        run: npm run check:strings

      - name: Gate runner (P1\u2013P10, P23\u2013P25 + A1\u2013A4, A7, A8, A16, A21)
        run: npm run check:gates

      - name: Build
        run: npm run build

      - name: A22 eval (mock — harness sanity)
        run: npm run check:eval

      # Share the built app with the downstream `e2e` job instead of
      # rebuilding. `.next/` + generated `public/sw.js` are all
      # `next start` needs. Saves ~2 min per PR.
      #
      # `include-hidden-files: true` is load-bearing — upload-artifact
      # v4 excludes dotfile paths by default, and `.next/` would
      # silently not ship, leaving e2e with an empty runtime.
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: next-build
          path: |
            pang-2026/.next/
            pang-2026/public/sw.js
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error

  e2e:
    name: Playwright e2e (Tier 2)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: gates
    env:
      NEXT_PUBLIC_SUPABASE_HOST: "example.supabase.co"
      # Serve the prod build (downloaded from gates) via `next start`
      # for parity with Vercel. Playwright's webServer respects CI=1
      # and runs `npm run start`.
      CI: "1"
    defaults:
      run:
        working-directory: pang-2026
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: pang-2026/.nvmrc
          cache: npm
          cache-dependency-path: pang-2026/package-lock.json

      # Same install strategy as `gates` — see the comment there.
      - name: Install
        run: |
          npm ci --no-audit --no-fund --prefer-offline
          npm install --no-save --no-audit --no-fund \
            lightningcss-linux-x64-gnu \
            @tailwindcss/oxide-linux-x64-gnu

      # Reuse the `.next/` and `public/sw.js` that `gates` built.
      # download-artifact unpacks preserving archived paths, so files
      # land back at `pang-2026/.next/` and `pang-2026/public/sw.js`.
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: next-build

      # Cache Playwright browsers across runs. The key is tied to
      # `package-lock.json` (Playwright version moves with the lock).
      # Cache hit → skip browser download, only install apt deps.
      # Cache miss → full `install --with-deps`.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pang-2026/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright browsers (cache miss)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system deps (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Run Playwright (headless)
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: pang-2026/playwright-report/
          retention-days: 7
